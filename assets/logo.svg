<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="title desc">
  <title id="title">nexo-dns</title>
  <desc id="desc">Escudo de red para DNS privado, filtrado y recursivo</desc>
  <defs>
    <linearGradient id="brand" x1="70" y1="70" x2="330" y2="330" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f43f5e"/>
      <stop offset="0.36" stop-color="#67b279"/>
      <stop offset="0.7" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <radialGradient id="panel" cx="50%" cy="35%" r="72%">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0b1018"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="400" height="400" rx="64" fill="#0d1117"/>
  <circle cx="200" cy="190" r="148" fill="#22d3ee" opacity="0.055"/>
  <path d="M200 54 326 105v102c0 80-52 130-126 153C126 337 74 287 74 207V105Z"
