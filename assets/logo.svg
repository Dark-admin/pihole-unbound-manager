<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff1a1a"/>
      <stop offset="33%" stop-color="#ff7b00"/>
      <stop offset="66%" stop-color="#ffd400"/>
      <stop offset="100%" stop-color="#1a8cff"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" rx="48" fill="#0d1117"/>
  <circle cx="200" cy="200" r="150" fill="url(#glow)"/>
  <!-- Escudo estilo Pi-hole con los 4 colores -->
  <path d="M200 70 L320 120 V230 C320 300 260 340 200 355 C140 340 80 300 80 230 V120 Z"
        fill="none" stroke="url(#g1)" stroke-width="14" stroke-linejoin="round"/>
  <!-- Slash central (bloqueo) -->
  <line x1="130" y1="285" x2="270" y2="125" stroke="url(#g1)" stroke-width="12" stroke-linecap="round"/>
  <!-- Punto central -->
  <circle cx="200" cy="200" r="26" fill="url(#g1)"/>
  <!-- Texto -->
  <text x="200" y="385" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700"
        text-anchor="middle" fill="#e6edf3">Pi-hole · Unbound</text>
</svg>
