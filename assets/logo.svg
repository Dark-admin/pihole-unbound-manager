  <path d="M128 250V145l144 105V145" fill="none" stroke="#e6edf3" stroke-width="18"
        stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="128" cy="145" r="15" fill="#f43f5e" stroke="#0d1117" stroke-width="6"/>
  <circle cx="200" cy="198" r="15" fill="#67b279" stroke="#0d1117" stroke-width="6"/>
  <circle cx="272" cy="250" r="15" fill="#22d3ee" stroke="#0d1117" stroke-width="6"/>
  <circle cx="272" cy="145" r="15" fill="#6366f1" stroke="#0d1117" stroke-width="6"/>

  <path d="M132 292h136" stroke="#475569" stroke-width="8" stroke-linecap="round"/>
  <path d="M160 316h80" stroke="#94a3b8" stroke-width="8" stroke-linecap="round" opacity="0.85"/>
